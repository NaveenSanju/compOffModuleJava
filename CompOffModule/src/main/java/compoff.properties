# ============================================================
# Comp Off module settings
# ============================================================

# Stylesheets: linked in contentpages/compoff/layout/header.jsp (colours, fonts, page width: asserts/css/compoff-theme.css).

# Time zone used to decide "today" (future worked date check on Holiday Intimation, cancellable comp off leave).
compoff.timezone=Asia/Kolkata

# Maximum characters for Reason / Notes / Cancel reason fields (must match the DB column size).
compoff.text.maxlength=500

# Working hours of one Full day (My Comp Off Report: Full day = 08:00 Hrs, Half day = half of it).
compoff.hours.fullday=8

# Maximum number of days in one Apply Comp Off request (each day becomes one CompensatoryOffRequest row).
compoff.apply.maxdays=31

# Access from the user type code in Staffs.userType (UserTypes.userType), comma separated, case-insensitive:
# Admin access, Employee (staff) access, Approver (Team Leader / Manager) access. Any other code: no access.
# HR users are approvers only when named in General Settings (and see their own pages then).
compoff.usertype.admin=C
compoff.usertype.employee=T,S,QC
compoff.usertype.approver=TL,PM,MR,HR

# companyID: not set here. Each user works for their own company (Staffs.companyID, kept in the session at login).
